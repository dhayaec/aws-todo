services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder   # use builder stage in dev so we get hot-reload via volume
    command: pnpm dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cloudtodo
      JWT_SECRET: dev-jwt-secret-change-in-production-min-32-chars
      REFRESH_SECRET: dev-refresh-secret-change-in-production-min-32-chars
      # Override S3 to use LocalStack in dev
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: cloud-todo-dev
      AWS_ENDPOINT_URL_S3: http://localstack:4566
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudtodo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # LocalStack provides a local S3 for development
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
      EAGER_SERVICE_LOADING: 1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    restart: unless-stopped

volumes:
  postgres_data:
  localstack_data:
